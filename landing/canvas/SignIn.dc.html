<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PitchIt – Prihlásenie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500;700&family=Outfit:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.h{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;letter-spacing:-0.02em;margin:0}
.muted{color:#B4B4BE}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;padding:13px 22px;min-height:46px;border-radius:999px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;border:1px solid #4A4A52;background:transparent;color:#F5F5F7;transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-2px)}
.btn-p{background:linear-gradient(135deg,#D2FF6B,var(--accent) 55%,#7AB800);color:#141414;border-color:#AAFF00}
.btn-p:hover{filter:brightness(1.08)}
.card{background:linear-gradient(160deg,#222228,#1A1A1F);border:1px solid #333333;border-radius:20px;padding:24px}
.chip{display:inline-block;padding:7px 14px;border:1px solid #4A4A52;border-radius:999px;font-size:13px;color:#DEDEE6}
.eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
input[type=text],input[type=email],input[type=password]{width:100%;box-sizing:border-box;padding:13px 16px;min-height:46px;border-radius:12px;border:1px solid #4A4A52;background:#1E1E22;color:#F5F5F7;font:inherit}
label.l{display:block;font-size:14px;font-weight:700;margin:16px 0 8px}
input[type=text],input[type=email],input[type=password]{transition:border-color .15s,box-shadow .15s}
input[type=text]:focus,input[type=email]:focus,input[type=password]:focus{outline:none;border-color:#AAFF00;box-shadow:0 0 0 3px rgba(170,255,0,.18)}
input::placeholder{color:#7A7A86}
.auth{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:900px;padding:48px 24px;box-sizing:border-box}
.blob{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none}
.panel{position:relative;width:100%;max-width:460px;box-sizing:border-box;background:linear-gradient(160deg,rgba(34,34,40,.95),rgba(26,26,31,.95));border:1px solid #333333;border-radius:28px;padding:40px 36px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.soc{width:100%;min-height:48px;margin-top:10px}
.sep{display:flex;align-items:center;gap:12px;color:#B4B4BE;font-size:13px;margin:24px 0 14px}
.sep span{flex:1;height:1px;background:#333333}
.seg{display:flex;gap:4px;background:#141414;border:1px solid #333333;border-radius:999px;padding:4px}
.seg button{flex:1;font:inherit;font-weight:700;font-size:14px;cursor:pointer;border:0;border-radius:999px;padding:11px 14px;min-height:44px;background:transparent;color:#B4B4BE;transition:all .15s}
.seg button[aria-pressed=true]{background:#AAFF00;color:#141414}
input:-webkit-autofill{-webkit-text-fill-color:#F5F5F7;-webkit-box-shadow:0 0 0 100px #1E1E22 inset;caret-color:#F5F5F7}
</style>
</helmet>
<div style="--accent:{{accent}};background:radial-gradient(900px 600px at 90% 0,rgba(125,81,254,.38),transparent 60%),radial-gradient(700px 500px at 0 20%,rgba(170,255,0,.10),transparent 60%),#141414;color:#F5F5F7;font-family:'DM Sans',sans-serif;min-height:100%">
<div class="auth"><div class="blob" style="width:420px;height:420px;background:#7D51FE;opacity:.35;top:-120px;right:8%"></div><div class="blob" style="width:360px;height:360px;background:#AAFF00;opacity:.14;bottom:-120px;left:10%"></div><a href="Main.dc.html" aria-label="PitchIt domov" style="position:relative;margin-bottom:28px"><span style="display:inline-flex;align-items:center;gap:10px"><svg width="26" height="36" viewBox="-4 -4 216 292" aria-hidden="true"><path d="M8 52C5 42 10 36 20 31L52 6C62 -1 72 0 82 4L158 41C190 57 212 90 205 126C202 146 193 158 185 165C183 149 178 140 168 134L12 58C10 57 9 55 8 52Z" fill="#AAFF00"/><path d="M73 100V214C73 232 64 242 50 250L9 281C5 284 2 282 2 278V140C2 128 8 120 18 114Z" fill="#7AB800"/><path d="M99 130L166 161L101 211Z" fill="#D2FF6B" stroke="#D2FF6B" stroke-width="10" stroke-linejoin="round"/></svg><span style="font-family:'Outfit',sans-serif;font-weight:700;font-size:26px;letter-spacing:-0.03em;color:#F5F5F7">Pitch<span style="color:#AAFF00">It</span></span></span></a><div class="panel"><h1 class="h" style="font-size:36px;text-align:center">Vitaj späť.</h1><p class="muted" style="text-align:center;margin:10px 0 8px;font-size:16px">Prihlás sa a pokračuj v cvičení svojho pitchu.</p><label class="l" for="e">E-mail</label><input id="e" type="email" placeholder="ty@startup.sk"><label class="l" for="p">Heslo</label><input id="p" type="password" placeholder="Tvoje heslo"><div style="text-align:right;margin:12px 0 24px;font-size:14px"><a href="#" style="color:#AAFF00">Zabudnuté heslo?</a></div><a class="btn btn-p" href="Onboarding.dc.html" style="width:100%;box-sizing:border-box;min-height:52px">Prihlásiť sa</a><div class="sep"><span></span>alebo<span></span></div><button class="btn soc" type="button">Pokračovať cez Google</button><button class="btn soc" type="button">Pokračovať cez LinkedIn</button><p class="muted" style="text-align:center;margin:26px 0 0;font-size:14px">Ešte nemáš účet? <a href="SignUp.dc.html" style="color:#AAFF00;font-weight:700">Vytvoriť účet</a></p></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#AAFF00"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#AAFF00' };
}
}
</script>
</body>
</html>
